spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:ipassangerDb}:${DB_PORT:5432}/${DB_NAME:ipassangerDb}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}
